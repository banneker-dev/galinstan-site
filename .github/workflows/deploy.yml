name: Deploy

# Preview on every branch push, so a change is verifiable on a real URL before a pull
# request exists. Production only on a site-* tag, and only after the production guards
# pass — which today means only after every string on the page has been approved.
on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
    tags: ["site-*"]
  workflow_dispatch: {}

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own `env` is not in scope for that step's `if`.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/site-') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # actions/checkout passes --no-tags even at depth 0, so without this the
          # annotated tag object never reaches the runner and the signature check below
          # reads a tag that is not there. It cost site-2026.09.2.
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: public/ is current
        run: python3 build.py --check

      - name: Tests
        run: python3 -m unittest discover -s tests

      # Red means no deploy: these run before the deploy step, never after it.
      - name: Guards
        run: python3 tools/guards.py

      # Ask 22. `git verify-tag` cannot check an SSH signature without being told which
      # keys are trusted, and it exits 0 on an *unsigned* tag in some versions — so the
      # signature is required explicitly rather than inferred from the exit code.
      - name: The release tag must be signed
        if: env.IS_RELEASE == 'true'
        run: |
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          # A key line, not the absence of a phrase: a check a comment can satisfy is
          # not a check. Blank lines and comments do not count as a trusted key.
          if ! grep -qE "^[^#[:space:]]+[[:space:]]+(ssh|sk-ssh)-" .github/allowed_signers; then
            echo "::error::.github/allowed_signers holds no signing key."
            echo "Create the key and commit its public half. Until then nothing can be"
            echo "verified, so nothing is trusted."
            exit 1
          fi
          # Two checks, because neither is sufficient alone.
          #
          # First: is there a signature at all? `git verify-tag` exits 0 on an unsigned
          # tag in some versions, so its exit code cannot answer this.
          # Belt and braces with fetch-tags above: fetch the one tag explicitly, so this
          # does not depend on an action's default that has already changed once.
          git fetch --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || true

          # Three states, and only one of them is a release: the object is missing, it is
          # a lightweight tag pointing straight at a commit, or it is an annotated tag.
          # Only an annotated tag can carry a signature, and a missing one must not read
          # as unsigned — that is a different failure with a different fix.
          kind=$(git cat-file -t "${GITHUB_REF_NAME}" 2>/dev/null || echo missing)
          if [ "$kind" = "missing" ]; then
            echo "::error::${GITHUB_REF_NAME} did not reach the runner. This is a checkout"
            echo "problem, not a signing one: the tag object was not fetched."
            exit 1
          fi
          if [ "$kind" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag ($kind), which cannot"
            echo "carry a signature. Cut it with git tag -s."
            exit 1
          fi
          if ! git cat-file tag "${GITHUB_REF_NAME}" | grep -qE "BEGIN (SSH|PGP) SIGNATURE"; then
            echo "::error::${GITHUB_REF_NAME} carries no signature at all. Sign it: git tag -s"
            exit 1
          fi
          # Second: is it good, and from a key we trust? Here the exit code is meaningful.
          #
          # This used to grep the --raw output for GOODSIG, which could never match an SSH
          # signature: GOODSIG is a GPG status token, and git reports an SSH signature as
          # `Good "git" signature for <principal>`. It failed site-2026.09.1 on a tag whose
          # signature was perfectly valid. It failed closed — nothing was published — but a
          # check that cannot pass is not a check either.
          if ! git verify-tag "${GITHUB_REF_NAME}"; then
            echo "::error::${GITHUB_REF_NAME} has a signature, but not one from a trusted key."
            echo "The trusted keys are in .github/allowed_signers."
            exit 1
          fi

      - name: Production guards
        if: env.IS_RELEASE == 'true'
        run: python3 tools/guards.py --production

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Ask 21. A release tag deploys to `production`, which is the Cloudflare Pages
          # production branch; every branch push, including main, deploys to a branch of
          # its own name and is therefore a preview. Before this, a tag and a push to main
          # both landed on `main`, so if main had been the production branch an ordinary
          # push would have reached the live domain without passing the production guards.
          # Nothing else in this repository assumes `main` is production.
          command: >-
            pages deploy public
            --project-name=galinstan
            --branch=${{ startsWith(github.ref, 'refs/tags/') && 'production' || github.ref_name }}

      # A release that publishes nothing and reports success is the worst outcome
      # available here, so a tag fails on missing credentials rather than noticing them.
      # A branch push may still no-op: a preview with no project to deploy to is a
      # gap in setup, not a broken release.
      - name: A release requires credentials
        if: env.IS_RELEASE == 'true' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: |
          echo "::error::Refusing to cut a release with no Cloudflare credentials."
          echo "CLOUDFLARE_API_TOKEN set: ${{ env.CLOUDFLARE_API_TOKEN != '' }}"
          echo "CLOUDFLARE_ACCOUNT_ID set: ${{ env.CLOUDFLARE_ACCOUNT_ID != '' }}"
          echo "Both are repository secrets on galinstan-site. Names matter: the workflow"
          echo "reads these two exactly. See RELEASE.md."
          exit 1

      - name: Not deployed — no Cloudflare credentials
        if: env.IS_RELEASE != 'true' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::Built and guarded, but not deployed: CLOUDFLARE_API_TOKEN is not set."
          echo "A branch push with no project to deploy to is a setup gap, not a failure."

      # Adversarial verification, over the live response rather than the artifact: the
      # approved headline must be in the body, and no third-party host may be fetched
      # except the one permitted beacon, which Cloudflare injects after the build and
      # which no build-time guard can see. See docs/ANALYTICS.md.
      - name: Verify what is actually being served
        if: env.IS_RELEASE == 'true'
        run: |
          sleep 20
          python3 tools/verify_live.py https://galinstan.ai/ https://galinstan.ai/privacy
