name: Deploy

# Preview on every branch push, so a change is verifiable on a real URL before a pull
# request exists. Production only on a site-* tag, and only after the production guards
# pass — which today means only after every string on the page has been approved.
on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
    tags: ["site-*"]
  workflow_dispatch: {}

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own `env` is not in scope for that step's `if`.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/site-') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: public/ is current
        run: python3 build.py --check

      - name: Tests
        run: python3 -m unittest discover -s tests

      # Red means no deploy: these run before the deploy step, never after it.
      - name: Guards
        run: python3 tools/guards.py

      # Ask 22. `git verify-tag` cannot check an SSH signature without being told which
      # keys are trusted, and it exits 0 on an *unsigned* tag in some versions — so the
      # signature is required explicitly rather than inferred from the exit code.
      - name: The release tag must be signed
        if: env.IS_RELEASE == 'true'
        run: |
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          # A key line, not the absence of a phrase: a check a comment can satisfy is
          # not a check. Blank lines and comments do not count as a trusted key.
          if ! grep -qE "^[^#[:space:]]+[[:space:]]+(ssh|sk-ssh)-" .github/allowed_signers; then
            echo "::error::.github/allowed_signers holds no signing key."
            echo "Create the key and commit its public half. Until then nothing can be"
            echo "verified, so nothing is trusted."
            exit 1
          fi
          git verify-tag --raw "${GITHUB_REF_NAME}" 2>&1 | grep -q GOODSIG || {
            echo "::error::${GITHUB_REF_NAME} carries no valid signature from a trusted key."
            exit 1
          }

      - name: Production guards
        if: env.IS_RELEASE == 'true'
        run: python3 tools/guards.py --production

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Ask 21. A release tag deploys to `production`, which is the Cloudflare Pages
          # production branch; every branch push, including main, deploys to a branch of
          # its own name and is therefore a preview. Before this, a tag and a push to main
          # both landed on `main`, so if main had been the production branch an ordinary
          # push would have reached the live domain without passing the production guards.
          # Nothing else in this repository assumes `main` is production.
          command: >-
            pages deploy public
            --project-name=galinstan
            --branch=${{ startsWith(github.ref, 'refs/tags/') && 'production' || github.ref_name }}

      - name: Not deployed — no Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::Built and guarded, but not deployed: CLOUDFLARE_API_TOKEN is not set."
          echo "The Cloudflare Pages project has not been created yet. See RELEASE.md."

      # Adversarial verification, over the live response rather than the artifact: the
      # approved headline must be in the body, and no third-party host may be fetched
      # except the one permitted beacon, which Cloudflare injects after the build and
      # which no build-time guard can see. See docs/ANALYTICS.md.
      - name: Verify what is actually being served
        if: env.IS_RELEASE == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 20
          python3 tools/verify_live.py https://galinstan.ai/ https://galinstan.ai/privacy.html
